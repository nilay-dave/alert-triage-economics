site_name: alert-triage-economics
site_description: Measure what an alert tuning change costs in missed detections.
repo_url: https://github.com/__GITHUB_USERNAME__/alert-triage-economics
repo_name: __GITHUB_USERNAME__/alert-triage-economics
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Switch to light mode }
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Overview: index.md
  - Reading the frontier: reading-the-frontier.md
  - The statistics: statistics.md
  - Decisions:
      - ADR-001 Bootstrap over point estimates: adr/adr-001-bootstrap-over-point-estimates.md
      - ADR-002 Capped noise pool: adr/adr-002-capped-noise-pool.md
      - ADR-003 Synthetic corpus: adr/adr-003-synthetic-corpus.md
      - ADR-004 Which number to lead with: adr/adr-004-which-number-to-lead-with.md
      - ADR-005 Insufficient evidence: adr/adr-005-insufficient-evidence.md
  - Example report: report.html
