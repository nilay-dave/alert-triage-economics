[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-triage-economics"
version = "0.1.0"
description = "Replays labelled alert streams to measure what each tuning change costs in missed true positives."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["soc", "alert-triage", "detection-tuning", "false-positives", "security-metrics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
ate = "ate.cli:app"

[project.urls]
Homepage = "https://github.com/__GITHUB_USERNAME__/alert-triage-economics"
Documentation = "https://__GITHUB_USERNAME__.github.io/alert-triage-economics/"
Issues = "https://github.com/__GITHUB_USERNAME__/alert-triage-economics/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ate/cli.py" = ["B008"]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/ate"]
branch = true
