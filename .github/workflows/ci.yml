name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools benchmark scripts
      - name: Test
        run: pytest --cov=ate --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Every declared dependency is used
        if: matrix.python-version == '3.13'
        run: python tools/check_dependencies.py

      - name: Report colour contrast
        if: matrix.python-version == '3.13'
        run: python tools/check_contrast.py

      - name: Upload coverage xml
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  numbers:
    # Re-measures every number the README and docs publish, and fails on drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Measure
        run: |
          pytest --cov=ate --cov-report=xml -q
          python benchmark/run_benchmark.py --sizes 50000 --repeats 1
          python tools/collect_metrics.py
      - name: Check published numbers
        run: python tools/check_numbers.py

  self-analysis:
    # The tool analyses its own bundled corpus, so a change that breaks the
    # analysis path fails CI even if the unit tests still pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate and analyse
        run: |
          ate generate --alerts 200000 --out data/generated/ci.parquet --seed 7
          ate frontier --alerts data/generated/ci.parquet \
            --out docs/report.html --json docs/frontier.json --resamples 400
      - name: A quarter cut must stay inside the loss budget
        run: ate gate --alerts data/generated/ci.parquet --cut 0.25 --max-tp-loss-pct 8 --resamples 400
      - name: Half a cut must breach it
        # Asserts the gate can fail. A gate that cannot fail is not a gate.
        run: |
          if ate gate --alerts data/generated/ci.parquet --cut 0.5 --max-tp-loss-pct 8 --resamples 400; then
            echo "gate passed a cut that should have breached the budget"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: frontier-report
          path: |
            docs/report.html
            docs/frontier.json
            docs/charts/

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Audit the repository's own provenance signals
        run: python scripts/provenance_check.py
